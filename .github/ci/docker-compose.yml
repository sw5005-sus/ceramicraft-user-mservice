services:
  mysql-container:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=user_db
    # Pure memory, disappears when CI ends
    tmpfs: /var/lib/mysql
    networks:
      ci-net:
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 2s
      retries: 5

  kafka-container:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-container
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: ohAxBaI7QUuIq7lQBYzRYA  
    command: >
      bash -c "
        if [ ! -f /var/lib/kafka/data/meta.properties ]; then
          kafka-storage format -t $$CLUSTER_ID -c /etc/kafka/kraft/server.properties;
        fi &&
        kafka-server-start /etc/kafka/kraft/server.properties
      "
    networks: 
      ci-net: 
  
  vault:
    image: hashicorp/vault:1.14.0
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    entrypoint: >
      sh -c "vault server -dev -dev-root-token-id=root-token -dev-listen-address=0.0.0.0:8200 & 
             export VAULT_ADDR='http://127.0.0.1:8200';
             export VAULT_TOKEN='root-token';
             echo 'Waiting for vault...';
             until vault status > /dev/null 2>&1; do sleep 1; done;
             vault kv put secret/ceramicraft/sec_config aes_key=your-aes-key hmac_key=your-hmac-salt;
             echo 'Verifying secret...';
             vault kv get secret/ceramicraft/sec_config || echo 'FAILED TO WRITE';
             wait"
    networks:
      ci-net:
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 2s
      retries: 5

  ceramicraft-user-mservice:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: ceramicraft-user-mservice
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_EMAIL_FROM=${SMTP_EMAIL_FROM}
      - JWT_SECRET=${JWT_SECRET}
      - ZITADEL_APP_API_KEY={"key":"test-key"}
      - ZITADEL_SERVICE_API_KEY={"key":"test-key"}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root-token

    depends_on:
      mysql-container:
        condition: service_healthy
      kafka-container:
        condition: service_started
      vault:
        condition: service_healthy

    networks:
      - ci-net
    ports:
      - "8080:8080"   
    command: ["sh", "-c", "apk add --no-cache netcat-openbsd && chmod +x /app/wait-for.sh && ./wait-for.sh mysql-container 3306 ./main"]
    volumes:
      - ./wait-for.sh:/app/wait-for.sh   # CI only wait-for script
    user: root
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/user-ms/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
networks:
  ci-net: